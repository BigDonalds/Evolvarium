name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
        # No 3.10 is built for Windows on ARM, so 3.11 is the oldest there.
        include:
          - os: windows-11-arm
            python: "3.11"
          - os: windows-11-arm
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      # Every held-out game of the shipped model. Run on each platform because a
      # different BLAS can round a sum differently and flip a move.
      - run: python -m pytest -m slow

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.16.6
      - run: ruff check .
